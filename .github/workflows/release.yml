name: Publier l'image ADH

# Déclenchement sur le push d'un tag de version. Le job « verifier » s'assure
# que ce tag pointe bien sur un commit contenu dans main avant toute publication.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  verifier:
    name: Contrôles préalables
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire la version du tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME, version $version"

      - name: Vérifier que le tag est porté par main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # Un tag annoté ne pointe pas directement sur un commit : on le déréférence.
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME pointe sur le commit $commit, absent de main. Publication refusée."
            exit 1
          fi
          echo "Le commit $commit est bien contenu dans main."

      - name: Vérifier assets/version.js
        run: |
          declaree=$(sed -n "s/.*version: *'\([^']*\)'.*/\1/p" assets/version.js)
          attendue="${{ steps.version.outputs.version }}"
          if [ "$declaree" != "$attendue" ]; then
            echo "::error file=assets/version.js::Version déclarée '$declaree', tag '$attendue'. Mettre à jour assets/version.js avant de taguer."
            exit 1
          fi
          echo "assets/version.js déclare bien $declaree."

      - name: Vérifier l'entrée de changelog
        run: |
          attendue="${{ steps.version.outputs.version }}"
          if ! grep -qE "^## \[$attendue\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Aucune section « ## [$attendue] » dans CHANGELOG.md."
            exit 1
          fi
          echo "Entrée de changelog présente pour $attendue."

      - name: Contrôler la syntaxe des scripts
        run: |
          for f in assets/version.js assets/rules.js assets/sources.js assets/guides.js assets/textes.js assets/parcours.js assets/nav.js assets/app.js assets/expertise-moteur.js assets/expertise.js assets/copie.js assets/phrases.js; do
            node --check "$f" && echo "  ok  $f"
          done
          node --check tools/construire-index.js && echo "  ok  tools/construire-index.js"
          for f in data/expertise.json data/compagnies/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" && echo "  ok  $f"
          done

      - name: Valider l'arbre de décision
        run: node tests/tree.test.js

      - name: Valider les invariants de navigation
        run: node tests/parcours.test.js

      - name: Valider les textes à coller et les guides
        run: node tests/textes.test.js

      - name: Valider les fiches contrat Expertise
        run: node tests/expertise.test.js

  publier:
    name: Construire et publier l'image
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à la registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ vars.IMAGE_NAME || github.repository }}
          tags: |
            type=raw,value=${{ needs.verifier.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verifier.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.verifier.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=AssuDecisionHelper
            org.opencontainers.image.version=${{ needs.verifier.outputs.version }}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ADH_VERSION=${{ needs.verifier.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        run: |
          {
            echo "## ADH ${{ needs.verifier.outputs.version }} publié"
            echo
            echo "Tags poussés :"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
