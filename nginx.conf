server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;

    gzip              on;
    gzip_min_length   512;
    gzip_vary         on;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Sonde utilisée par le HEALTHCHECK du conteneur et par l'orchestrateur.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Les fichiers ne portent pas d'empreinte dans leur nom : on impose une
    # revalidation à chaque requête pour qu'un redéploiement soit pris en compte
    # immédiatement. Le coût est un 304, négligeable pour un site de cette taille.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
