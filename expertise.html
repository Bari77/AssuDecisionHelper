<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADH — Expertise · formulaire de dossier</title>
    <meta
      name="description"
      content="Formulaire d'expertise : capitaux, frais et textes de dossier calculés d'après la nature, la compagnie, le contrat et l'option."
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body class="page-expertise">
    <header class="topbar">
      <div class="wrap wrap--wide topbar__inner">
        <a class="brand" href="index.html">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__text">
            <strong>ADH <span class="brand__version" id="brand-version"></span></strong>
            <span>Expertise après sinistre</span>
          </span>
        </a>
        <nav class="nav" id="nav-principal" aria-label="Navigation principale"></nav>
      </div>
    </header>

    <main class="wrap wrap--wide">
      <p id="exp-erreur" class="exp-erreur" hidden></p>

      <div class="exp-layout">
        <div class="exp-col exp-col--fiche">
          <section class="exp-card" aria-labelledby="titre-contrat">
            <h2 id="titre-contrat">Contrat</h2>
            <div class="exp-grid">
              <div class="field">
                <span class="field__label">Nature du sinistre</span>
                <input type="hidden" id="exp-nature" />
                <div id="combo-nature"></div>
              </div>
              <div class="field">
                <span class="field__label">Compagnie</span>
                <input type="hidden" id="exp-compagnie" />
                <div id="combo-compagnie"></div>
              </div>
              <div class="field">
                <span class="field__label">Type de contrat</span>
                <input type="hidden" id="exp-type" />
                <div id="combo-type"></div>
              </div>
              <div class="field">
                <span class="field__label">Numéro de contrat</span>
                <input type="hidden" id="exp-numero" />
                <div id="combo-numero"></div>
              </div>
              <div class="field">
                <span class="field__label">Option</span>
                <input type="hidden" id="exp-option" />
                <div id="combo-option"></div>
              </div>
              <div class="field">
                <span class="field__label">Contrat</span>
                <output id="exp-libelle" class="field__input calcule">—</output>
              </div>
            </div>
            <p id="exp-motif" class="exp-motif" hidden></p>
            <div id="exp-source" class="exp-source"></div>
          </section>

          <section class="exp-card" aria-labelledby="titre-capitaux">
            <h2 id="titre-capitaux">Capitaux</h2>
            <div id="exp-capitaux" class="exp-pile"></div>
            <div id="exp-vigilance" class="exp-vigilance"></div>
          </section>

          <section class="exp-card" aria-labelledby="titre-frais">
            <h2 id="titre-frais">Frais et pertes</h2>
            <div id="exp-frais" class="exp-pile"></div>
          </section>
        </div>

        <div class="exp-col exp-col--textes">
          <section class="exp-card" aria-labelledby="titre-causes">
            <h2 id="titre-causes">Causes et circonstances</h2>
            <!-- Une seule grille de 10 colonnes : data-largeur donne à chaque
                 champ la place que son contenu réclame, et un champ masqué
                 laisse les autres se replacer. Les champs porteurs de
                 data-champ-modele n'apparaissent que si le modèle de la nature
                 choisie cite l'une de leurs variables. -->
            <div class="exp-champs">
              <div class="field" data-largeur="2">
                <span class="field__label">Civilité</span>
                <input type="hidden" id="exp-civilite" />
                <div id="combo-civilite"></div>
              </div>
              <label class="field" data-largeur="5">
                <span class="field__label">Nom</span>
                <input id="exp-nom" class="field__input saisie" />
              </label>
              <label class="field" data-largeur="3">
                <span class="field__label">Date de visite</span>
                <input id="exp-date" class="field__input saisie" type="date" />
              </label>

              <label class="field" data-largeur="7">
                <span class="field__label">Adresse</span>
                <input id="exp-adresse" class="field__input saisie" />
              </label>
              <label class="field" data-largeur="3">
                <span class="field__label">Commune</span>
                <input id="exp-commune" class="field__input saisie" />
              </label>

              <div class="field" data-largeur="10">
                <span class="field__label">Qualité</span>
                <input type="hidden" id="exp-qualite" />
                <div id="combo-qualite"></div>
              </div>
              <div class="field" data-largeur="4" data-champ-modele="typeBien" hidden>
                <span class="field__label">Type de bien</span>
                <input type="hidden" id="exp-bien" />
                <div id="combo-bien"></div>
              </div>

              <label class="field" data-largeur="3" data-champ-modele="dateSinistre periode" hidden>
                <span class="field__label">Sinistre du</span>
                <input id="exp-sinistre-debut" class="field__input saisie" type="date" />
              </label>
              <label class="field" data-largeur="3" data-champ-modele="periode" hidden>
                <span class="field__label">au (facultatif)</span>
                <input id="exp-sinistre-fin" class="field__input saisie" type="date" />
              </label>
              <label class="field" data-largeur="4" data-champ-modele="vitesseVent" hidden>
                <span class="field__label">Vent max. (km/h)</span>
                <input id="exp-vent" class="field__input saisie" inputmode="decimal" />
              </label>

              <!-- Cases des variantes du modèle actif : elles sont déclarées
                   dans le référentiel (modeles.<nature>.variantes), libellé
                   compris, et rendues ici. Une nouvelle variante ne demande
                   donc aucune retouche du HTML. Elles ouvrent la rangée : la
                   variante « Phénomène » écarte la tempête nommée, la coche se
                   lit donc avant le champ qu'elle fait disparaître. -->
              <div class="exp-cases" data-largeur="3" id="exp-variantes" hidden></div>
              <label class="field" data-largeur="4" data-champ-modele="tempete" hidden>
                <span class="field__label">Nom de la tempête</span>
                <input id="exp-tempete" class="field__input saisie" />
              </label>
              <div class="field" data-largeur="3" data-champ-modele="alentour" hidden>
                <span class="field__label">Dommages alentour</span>
                <input type="hidden" id="exp-alentour" />
                <div id="combo-alentour"></div>
              </div>
            </div>
            <div id="exp-causes" class="exp-texte calcule"></div>
          </section>

          <section class="exp-card" aria-labelledby="titre-dommages">
            <h2 id="titre-dommages">Dommages constatés</h2>
            <div id="exp-dommages" class="exp-copies"></div>
          </section>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap wrap--wide footer__inner">
        <p class="footer__meta" id="footer-version"></p>
      </div>
    </footer>

    <script src="assets/version.js"></script>
    <script src="assets/nav.js"></script>
    <script src="assets/copie.js"></script>
    <script src="assets/expertise-moteur.js"></script>
    <script src="assets/expertise.js"></script>
  </body>
</html>
