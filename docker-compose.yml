version: "3.9"

# Hébergement d'ADH — AssuDecisionHelper
#
# Site statique servi par nginx non privilégié (port 8080), publié derrière Traefik.
# Aucun port n'est exposé sur l'hôte : le routage passe par le réseau traefik_proxy.
#
# Déploiement :
#   docker compose pull && docker compose up -d
#
# Épingler une version au lieu de « latest » :
#   ADH_VERSION=1.0.0 docker compose up -d

name: adh-prod

services:
  adh:
    image: registry.bariserv.net/adh/web:${ADH_VERSION:-latest}
    container_name: adh-prod-web
    restart: always
    read_only: true
    tmpfs:
      # nginx a besoin d'écrire ses fichiers temporaires et son pid.
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.adh.rule=Host(`adh.bariserv.net`)"
      - "traefik.http.routers.adh.entrypoints=websecure"
      - "traefik.http.routers.adh.tls=true"
      - "traefik.http.routers.adh.tls.certresolver=myresolver"
      - "traefik.http.services.adh.loadbalancer.server.port=8080"
      - "traefik.http.routers.adh.middlewares=rate-limit-global@file"

      - "traefik.http.routers.adh-http.rule=Host(`adh.bariserv.net`)"
      - "traefik.http.routers.adh-http.entrypoints=web"
      - "traefik.http.routers.adh-http.middlewares=redirect-to-https@file"
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
