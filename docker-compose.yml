# Hébergement d'ADH — AssuDecisionHelper
#
# Déploiement depuis la registry (cas courant) :
#   ADH_REGISTRY=registry.exemple.fr ADH_IMAGE=assurance/adh ADH_VERSION=1.0.0 docker compose up -d
#
# Build local depuis les sources, sans registry :
#   docker compose --profile build up -d --build

services:
  adh:
    image: ${ADH_REGISTRY:-ghcr.io}/${ADH_IMAGE:-owner/assudecisionhelper}:${ADH_VERSION:-1.0.0}
    container_name: adh
    restart: unless-stopped
    ports:
      # Port hôte réglable ; le conteneur écoute toujours sur 8080 en non privilégié.
      - "${ADH_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      # nginx a besoin d'écrire ses fichiers temporaires et son pid.
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Même service, mais construit depuis les sources locales.
  adh-build:
    profiles: ["build"]
    build:
      context: .
      args:
        ADH_VERSION: ${ADH_VERSION:-dev}
    image: adh:${ADH_VERSION:-dev}
    container_name: adh-build
    restart: unless-stopped
    ports:
      - "${ADH_PORT:-8080}:8080"
